server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/calorie_tracker?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SQL_SHOW:true}
    defer-datasource-initialization: true
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

# JWT 配置（本地开发用，上线前务必更换 secret）
app:
  jwt:
    secret: "${JWT_SECRET:calorie-tracker-dev-secret-key-0123456789abcdef0123456789abcdef}"
    expiration-ms: 604800000  # 7 天
  cors:
    # 允许的前端 Origin，逗号分隔；生产通过 CORS_ALLOWED_ORIGINS 注入
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  frontend:
    # 前端访问地址（拼邮件重置链接）；生产通过 APP_FRONTEND_URL 注入
    url: ${APP_FRONTEND_URL:http://localhost:5173}

# Actuator 配置：只暴露健康检查与 info，其余敏感端点默认不暴露
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always


