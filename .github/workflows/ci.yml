name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # ===== Job 1：后端测试（需要 MySQL 服务容器）=====
  backend-test:
    name: Backend Tests (mvn test)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: calorie_tracker
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run backend tests
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          cd calorie-server
          mvn -B test

  # ===== Job 2：前端构建 =====
  frontend-build:
    name: Frontend Build (vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          cd calorie-tracker-web
          npm ci

      - name: Run frontend tests
        run: |
          cd calorie-tracker-web
          npm test

      - name: Build frontend
        run: |
          cd calorie-tracker-web
          npm run build

  # ===== Job 3：构建 Docker 镜像（验证 Dockerfile）=====
  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./calorie-server
          push: false
          tags: calorie-tracker/backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./calorie-tracker-web
          push: false
          tags: calorie-tracker/frontend:ci